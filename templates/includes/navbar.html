{% load static %}
<header id="site-header" data-smart-header data-hidden="false"
    class="fixed inset-x-0 top-0 z-50 translate-y-0 opacity-100 transition-all duration-300 ease-out data-[hidden=true]:-translate-y-full data-[hidden=true]:opacity-0 data-[hidden=true]:pointer-events-none">
    <!-- Header Container -->
    <div id="header-shell" data-floating="false"
        class="mx-auto flex w-full max-w-7xl items-center justify-between gap-6 border border-transparent bg-transparent px-6 py-5 transition-all duration-300 ease-out data-[floating=true]:mt-3 data-[floating=true]:w-[calc(100%-2rem)] data-[floating=true]:max-w-6xl data-[floating=true]:rounded-2xl data-[floating=true]:border-blue-500/20 data-[floating=true]:bg-surface-2/90 data-[floating=true]:px-5 data-[floating=true]:py-3 data-[floating=true]:shadow-2xl data-[floating=true]:backdrop-blur-xl">

        <!-- Logo -->
        <a href="{% url 'home' %}#home" class="group flex shrink-0 items-center"
            aria-label="Abdulrahman Hasanen - Home">
            <img src="{% static 'images/logo.webp' %}" width="240" height="180" alt="Abdulrahman Hasanen Logo"
                class="block h-11 w-auto max-w-[150px] object-contain object-left">
        </a>


        <!-- Desktop Navigation -->
        <nav class="hidden items-center gap-1 md:flex" aria-label="Main navigation">

            <a href="{% url 'home' %}#home" data-nav="home"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}
                class="rounded-full {% if request.resolver_match.url_name == 'home' %}bg-blue-600/25 text-white{% else %}text-slate-300 hover:bg-blue-600/25 hover:text-white{% endif %} px-5 py-2.5 text-sm font-semibold transition-colors">
                Home
            </a>

            <a href="{% url 'about' %}" data-nav="about"{% if request.resolver_match.url_name == 'about' %} aria-current="page"{% endif %}
                class="rounded-full {% if request.resolver_match.url_name == 'about' %}bg-blue-600/25 text-white{% else %}text-slate-300 hover:bg-blue-600/25 hover:text-white{% endif %} px-5 py-2.5 text-sm font-medium transition-colors">
                About
            </a>

            <a href="{% url 'home' %}#projects" data-nav="projects"{% if False %} aria-current="page"{% endif %}
                class="rounded-full {% if False %}bg-blue-600/25 text-white{% else %}text-slate-300 hover:bg-blue-600/25 hover:text-white{% endif %} px-5 py-2.5 text-sm font-medium transition-colors">
                Projects
            </a>

            <a href="{% url 'resources' %}" data-nav="resources"{% if request.resolver_match.url_name == 'resources' %} aria-current="page"{% endif %}
                class="rounded-full {% if request.resolver_match.url_name == 'resources' %}bg-blue-600/25 text-white{% else %}text-slate-300 hover:bg-blue-600/25 hover:text-white{% endif %} px-5 py-2.5 text-sm font-medium transition-colors">
                Resources
            </a>

        </nav>


        <!-- Contact Button -->
        <a href="{% url 'home' %}#contact"
            class="group inline-flex items-center gap-3 rounded-full border border-blue-400/20 bg-[#080E1B] py-3 pl-2 pr-6 text-sm font-bold text-white shadow-lg shadow-black/20 transition-all duration-300 hover:bg-[#142746] hover:border-cyan-400/40 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-cyan-400/50 disabled:cursor-not-allowed disabled:opacity-60">
            <i class="fa-regular fa-paper-plane text-blue-400"></i>
            Contact Me
        </a>


        <!-- Mobile Menu Button -->
        <button id="mobile-menu-toggle" type="button"
            class="flex h-11 w-11 flex-col items-center justify-center gap-[6px] rounded-xl border border-slate-700 bg-surface-3 transition-colors hover:border-blue-500 md:hidden"
            aria-label="Open navigation menu" aria-controls="mobile-menu" aria-expanded="false">
            <span class="h-[2px] w-5 rounded-full bg-white transition-all duration-300"></span>
            <span class="h-[2px] w-5 rounded-full bg-white transition-all duration-300"></span>
            <span class="h-[2px] w-3.5 rounded-full bg-white transition-all duration-300"></span>
        </button>

    </div>


    <!-- Mobile Navigation -->
    <div id="mobile-menu"
        class="absolute left-4 right-4 top-full mt-2 hidden overflow-hidden rounded-2xl border border-slate-700/80 bg-surface-2/95 p-3 shadow-2xl backdrop-blur-xl md:hidden">

        <nav class="flex flex-col gap-1" aria-label="Mobile navigation">

            <a href="{% url 'home' %}#home" class="mobile-nav-link">
                Home
            </a>

            <a href="{% url 'about' %}" class="mobile-nav-link"{% if request.resolver_match.url_name == 'about' %} aria-current="page"{% endif %}>
                About
            </a>

            <a href="{% url 'home' %}#projects" class="mobile-nav-link">
                Projects
            </a>

            <a href="{% url 'resources' %}" class="mobile-nav-link"{% if request.resolver_match.url_name == 'resources' %} aria-current="page"{% endif %}>
                Resources
            </a>

            <a href="{% url 'home' %}#contact" class="mobile-nav-link text-blue-400">
                Contact Me <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-xs"></i>
            </a>

        </nav>

    </div>

</header>
